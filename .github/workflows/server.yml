name: Server CI

on:
  push:
    branches: [main]
    paths: ["src/server/**", "pyproject.toml"]
    # A release tag (vMAJOR.MINOR.PATCH) publishes the immutable image tag the
    # k8s manifests pin (k8s/server/deployment.yaml, kustomization.yaml). GitHub
    # does not evaluate `paths` for tag pushes.
    tags: ["v*"]
  pull_request:
    paths: ["src/server/**", "pyproject.toml"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum pyproject.toml supports; 3.14 is what the image
        # ships (FROM python:3.14-slim in src/server/Dockerfile). Keep it in
        # step with the Dockerfile.
        python-version: ["3.12", "3.14"]
    permissions:
      contents: read
    services:
      influxdb:
        image: influxdb:2
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: testpassword
          DOCKER_INFLUXDB_INIT_ORG: mallard
          DOCKER_INFLUXDB_INIT_BUCKET: metrics
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: testtoken
        ports:
          - "8086:8086"
        options: >-
          --health-cmd "curl -f http://localhost:8086/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit --skip-editable

      - name: Security scan (bandit)
        run: bandit -r src/server -x src/server/tests -ll

      - name: Run tests
        env:
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: testtoken
          INFLUX_ORG: mallard
          INFLUX_BUCKET: metrics
          API_KEYS: testkey
        run: pytest --cov=server --cov-report=xml -v

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          files: coverage.xml
          flags: server
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-push:
    name: Build, scan & Push Image
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/relativelyunknown/mallard-server
          if [ "$REF_TYPE" = "tag" ]; then
            # The k8s manifests pin e.g. mallard-server:v1.0.0 — publish exactly that.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::release tag is not vMAJOR.MINOR.PATCH[-prerelease]"
              exit 1
            fi
            tags="$image:$REF_NAME"
          else
            tags="$image:latest"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "$image:$SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once locally (amd64) and scan BEFORE anything is pushed, so a
      # vulnerable image never lands on GHCR under a tag the manifests deploy.
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/server/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: mallard-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy, fail on fixed HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master, pinned (same pin as security.yml)
        with:
          scan-type: image
          image-ref: mallard-server:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Same inputs + the warm cache from the build above: this only adds the
      # arm64 build and the push.
      - name: Push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
