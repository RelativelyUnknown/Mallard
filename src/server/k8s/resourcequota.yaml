# Namespace budget, sized for the worst case the manifests can actually reach:
# the server HPA at maxReplicas (10, server/hpa.yaml) plus a rolling update on
# top of it (default maxSurge 25% = 3 extra pods = 13 server pods), alongside
# the fixed pods. Per-pod figures come from the Deployments/StatefulSet:
#
#                          requests          limits
#   mallard-server  x13    100m / 128Mi      500m / 512Mi    -> 1.3 / 1664Mi    6.5 / 6656Mi
#   influxdb        x1     250m / 512Mi      1 / 2Gi         -> 0.25 / 512Mi    1 / 2048Mi
#   grafana         x1     100m / 128Mi      500m / 512Mi    -> 0.1 / 128Mi     0.5 / 512Mi
#   mallard-redis   x1     50m / 64Mi        250m / 160Mi    -> 0.05 / 64Mi     0.25 / 160Mi
#   total (16 pods)                                          -> 1.7 / 2368Mi    8.25 / 9376Mi
#
# A limits.cpu of 4 (the old value) capped the namespace at 4 server pods
# (floor((4 - 1.75 fixed) / 0.5)), so the HPA could never reach its max and
# stalled with "exceeded quota". If you change hpa.yaml's maxReplicas or the
# per-pod resources, redo this arithmetic.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mallard-quota
  namespace: mallard
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "10"
    limits.memory: 12Gi
    pods: "20"
